<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mother's Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose-gold: #c9967a;
    --rose-gold-light: #f5d0be;
    --champagne: #f7e7ce;
    --purple-deep: #4a3560;
    --purple-mid: #7b5ea7;
    --purple-light: #c3aee0;
    --white-glow: #fff8fc;
    --petal-pink: #f0c0d0;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0810;
    font-family: 'Lato', sans-serif;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    background: radial-gradient(ellipse at 50% 40%, rgba(123,94,167,0.18) 0%, transparent 70%);
    transition: background 1.8s ease;
  }

  #scene.revealed {
    background: radial-gradient(ellipse at 50% 30%, #fff0f5 0%, #ede0f7 40%, #e6e6fa 100%);
  }

  #open-btn {
    position: absolute;
    padding: 18px 52px;
    background: transparent;
    border: 1.5px solid rgba(201,150,122,0.7);
    border-radius: 60px;
    cursor: pointer;
    color: var(--champagne);
    font-family: 'Playfair Display', serif;
    font-size: clamp(15px, 2.5vw, 20px);
    font-style: italic;
    letter-spacing: 0.12em;
    outline: none;
    transition: opacity 0.9s ease, transform 0.9s ease;
    animation: btn-pulse 3s ease-in-out infinite;
    overflow: visible;
  }

  #open-btn::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 70px;
    border: 1px solid rgba(201,150,122,0.25);
    animation: btn-ring 3s ease-in-out infinite;
  }

  #open-btn::after {
    content: '';
    position: absolute;
    inset: -18px;
    border-radius: 80px;
    border: 1px solid rgba(201,150,122,0.1);
    animation: btn-ring 3s ease-in-out infinite 0.4s;
  }

  #open-btn:hover {
    background: rgba(201,150,122,0.1);
    color: #fff;
  }

  #open-btn.hidden {
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
  }

  @keyframes btn-pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(201,150,122,0.3), 0 0 40px rgba(201,150,122,0.1); }
    50% { box-shadow: 0 0 32px rgba(201,150,122,0.55), 0 0 70px rgba(201,150,122,0.2); }
  }

  @keyframes btn-ring {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }

  #card-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    opacity: 0;
    transform: scale(0.88) translateY(20px);
    transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.16,1,0.3,1);
    pointer-events: none;
    max-width: 700px;
    width: 90%;
    padding: 20px 0 40px;
  }

  #card-content.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  #cat-wrapper {
    text-align: center;
    width: clamp(400px, 38vw, 600px);
    height: auto;
    filter: drop-shadow(0 8px 40px rgba(123,94,167,0.22));
  }

  /* Updated CSS for your JPG image */
  #cat-wrapper img {
    width: 50%;
    height: auto;
    animation: float-subtle 6s ease-in-out infinite;
    mix-blend-mode: multiply; /* Blends the white background of the JPG seamlessly */
  }

  #title-line {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5.5vw, 56px);
    color: var(--purple-deep);
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-align: center;
    margin-top: 24px;
    min-height: 1.2em;
  }

  #title-line .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }

  #title-line .letter.space {
    width: 0.28em;
  }

  #title-line .letter.in {
    opacity: 1;
    transform: translateY(0);
  }

  #cursive-accent {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(22px, 3.5vw, 38px);
    color: var(--rose-gold);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
    letter-spacing: 0.05em;
    margin-top: 6px;
    text-align: center;
  }

  #cursive-accent.in { opacity: 1; transform: translateY(0); }

  #message-body {
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: clamp(14px, 2vw, 19px);
    color: var(--purple-deep);
    line-height: 1.8;
    text-align: center;
    max-width: 520px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    padding: 0 16px;
    margin-top: 16px;
    letter-spacing: 0.025em;
  }

  #message-body.in { opacity: 1; transform: translateY(0); }

  #divider {
    width: 0px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
    margin: 14px auto 0;
    transition: width 1.2s ease;
  }

  #divider.in { width: 180px; }

  .petal-ornament {
    display: block;
    text-align: center;
    font-size: 18px;
    opacity: 0;
    transition: opacity 1s ease;
    color: var(--rose-gold);
    letter-spacing: 6px;
    margin-top: 10px;
  }

  .petal-ornament.in { opacity: 0.6; }

  @keyframes float-subtle {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="scene">
  <button id="open-btn" aria-label="Open Mother's Day card">For my Mommy &nbsp;·&nbsp; Tap to open</button>

  <div id="card-content" aria-live="polite">

    <div id="cat-wrapper">
      <img src="file:///C:/Users/Lokesh/Downloads/flower_cat2.jpg">
    </div>

    <h1 id="title-line" aria-label="Happy Mother's Day"></h1>

    <p id="cursive-accent">with all my heart</p>

    <div id="divider"></div>

    <span class="petal-ornament" id="ornament">✦ &nbsp; ✦ &nbsp; ✦</span>

    <p id="message-body">
      Thank you for your endless love, your daily reels,<br>
      and for making every day brighter.<br>
      This flower is for you.
    </p>

  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener('resize', resize);

  function randomBetween(a, b) { return a + Math.random() * (b - a); }

  const COLORS = [
    [255, 240, 245],
    [245, 208, 190],
    [195, 174, 224],
    [247, 231, 206],
    [240, 192, 208],
    [255, 255, 255],
  ];

  function createParticle() {
    const c = COLORS[Math.floor(Math.random() * COLORS.length)];
    return {
      x: randomBetween(0, W),
      y: randomBetween(0, H),
      r: randomBetween(1.2, 4.2),
      vx: randomBetween(-0.18, 0.18),
      vy: randomBetween(-0.32, -0.08),
      alpha: 0,
      targetAlpha: randomBetween(0.3, 0.85),
      fadeIn: true,
      fadeOut: false,
      life: 0,
      maxLife: randomBetween(280, 600),
      color: c,
      pulse: randomBetween(0, Math.PI * 2),
      pulseSpeed: randomBetween(0.012, 0.03),
    };
  }

  for (let i = 0; i < 110; i++) {
    const p = createParticle();
    p.alpha = randomBetween(0, p.targetAlpha);
    p.life = randomBetween(0, p.maxLife);
    particles.push(p);
  }

  let revealedMode = false;
  let globalBrightness = 1.0;
  let targetBrightness = 1.0;

  function revealParticles() {
    revealedMode = true;
    targetBrightness = 0.4;
  }

  window.__revealParticles = revealParticles;

  function drawParticle(p) {
    const brightness = globalBrightness;
    const [r, g, b] = p.color;
    const pulseFactor = 0.85 + 0.15 * Math.sin(p.pulse);
    const alpha = p.alpha * pulseFactor * brightness;

    ctx.save();
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.8);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(0.5, `rgba(${r},${g},${b},${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);

    globalBrightness += (targetBrightness - globalBrightness) * 0.02;

    particles.forEach((p, i) => {
      p.life++;
      p.pulse += p.pulseSpeed;
      p.x += p.vx + Math.sin(p.life * 0.012 + p.pulse) * 0.15;
      p.y += p.vy;

      const lifeRatio = p.life / p.maxLife;
      if (lifeRatio < 0.15) {
        p.alpha = Math.min(p.alpha + 0.008, p.targetAlpha * (lifeRatio / 0.15));
      } else if (lifeRatio > 0.78) {
        p.alpha = Math.max(p.alpha - 0.008, 0);
      } else {
        p.alpha = Math.min(p.alpha + 0.004, p.targetAlpha);
      }

      if (p.y < -12 || p.x < -12 || p.x > W + 12 || p.life > p.maxLife) {
        const np = createParticle();
        np.y = H + 8;
        np.x = randomBetween(0, W);
        np.life = 0;
        np.alpha = 0;
        particles[i] = np;
      } else {
        drawParticle(p);
      }
    });

    requestAnimationFrame(animate);
  }

  animate();

  const btn = document.getElementById('open-btn');
  const scene = document.getElementById('scene');
  const cardContent = document.getElementById('card-content');
  const titleLine = document.getElementById('title-line');
  const cursive = document.getElementById('cursive-accent');
  const messageBody = document.getElementById('message-body');
  const divider = document.getElementById('divider');
  const ornament = document.getElementById('ornament');

  function buildTitle(text) {
    titleLine.innerHTML = '';
    const parts = text.split('');
    parts.forEach(char => {
      const span = document.createElement('span');
      span.classList.add('letter');
      if (char === ' ') {
        span.classList.add('space');
        span.innerHTML = '&nbsp;';
      } else {
        span.textContent = char;
      }
      titleLine.appendChild(span);
    });
  }

  buildTitle("Happy Mother's Day");

  function revealLetters() {
    const letters = titleLine.querySelectorAll('.letter');
    letters.forEach((el, i) => {
      setTimeout(() => {
        el.classList.add('in');
      }, i * 68);
    });

    const totalDelay = letters.length * 68 + 200;

    setTimeout(() => {
      cursive.classList.add('in');
    }, totalDelay);

    setTimeout(() => {
      divider.classList.add('in');
      ornament.classList.add('in');
    }, totalDelay + 400);

    setTimeout(() => {
      messageBody.classList.add('in');
    }, totalDelay + 700);
  }

  btn.addEventListener('click', function() {
    btn.classList.add('hidden');
    window.__revealParticles();

    setTimeout(() => {
      scene.classList.add('revealed');
    }, 200);

    setTimeout(() => {
      cardContent.classList.add('visible');
    }, 600);

    setTimeout(() => {
      revealLetters();
    }, 1600);
  });

})();
</script>
</body>
</html>
